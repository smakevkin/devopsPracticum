apiVersion: v1

kind: Service

metadata:
  name: pyapp
  namespace: pyapp

spec:
  selector:
    app: pyapp
  ports:
    - name: http
      port: 8000
      targetPort: http

---
apiVersion: apps/v1

kind: Deployment

metadata:
  name: pyapp
  namespace: pyapp
  labels:
    app: pyapp

spec:
  replicas: 3
  selector:
    matchLabels:
      app: pyapp
  template:
    metadata:
      labels:
        app: pyapp
    spec:
      containers:
        - name: pyapp
          image: ghcr.io/smakevkin/devopspracticum:sha-3fa7de4

          ports:
            - name: http
              containerPort: 8000

          envFrom:
            - configMapRef:
                name: pyapp-config

          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 5

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 3

          resources:
            requests:
              memory: "128Mi"
              cpu: "0.1"
            limits:
              memory: "256Mi"
              cpu: "0.5"
