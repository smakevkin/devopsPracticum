apiVersion: v1

kind: Service

metadata:
  name: db
  namespace: pyapp

spec:
  clusterIP: None
  selector:
    app: db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
apiVersion: apps/v1

kind: StatefulSet

metadata:
  name: db
  namespace: pyapp

spec:
  selector:
    matchLabels:
      app: db

  serviceName: db

  replicas: 1

  template:
    metadata:
      labels:
        app: db

    spec:
      containers:
        - name: db
          image: postgres:17-alpine

          ports:
            - containerPort: 5432

          envFrom:
            - secretRef:
                name: db-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data

          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6

          readinessProbe:
            exec:
              command: ["pg_isready"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 5

          resources:
            requests:
              memory: "256Mi"
              cpu: "0.25"
            limits:
              memory: "1Gi"
              cpu: "1"

  volumeClaimTemplates:
    - metadata:
        name: pgdata
      
      spec:
        accessModes: ["ReadWriteOnce"]
        
        resources:
          requests:
            storage: 1Gi
