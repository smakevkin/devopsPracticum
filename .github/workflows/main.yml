name: main pipeline

on:
    pull_request:
        branches: [dev, main]
    push:
        branches: [dev, main]

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-slim
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: 3.11
            - run: pip install ruff
            - run: ruff check app
            - run: ruff format --check app

    test:
        runs-on: ubuntu-slim
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: 3.11
            - run: pip install -r app/requirements.txt -r app/requirements-test.txt
            - run: pytest

    test-compose:
        runs-on: ubuntu-slim
        steps:
            - uses: actions/checkout@v4
            - run: docker compose --env-file compose/.env.example -f compose/docker-compose.yml config -q
    
    test-terraform:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: terraform
        steps:
            - uses: actions/checkout@v4
            - uses: hashicorp/setup-terraform@v4
              with:
                terraform_version: "1.16.6"
            - run: mkdir -p ~/.ssh && ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -C "GITHUB ACTIONS"
            - run: terraform fmt -check -recursive
            - run: terraform init -backend=false
            - run: terraform validate

    
    build:
        needs: [lint, test, test-compose]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v4

            - uses: docker/login-action@v3
              if: github.event_name != 'pull_request'
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/smakevkin/devopspracticum
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=sha
 
            - uses: docker/build-push-action@v6
              with:
                  context: ./app
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}

