name: main pipeline

on:
    pull_request:
        branches: [dev, main]
    push:
        branches: [dev, main]

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-slim
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: 3.11
            - run: pip install ruff
            - run: ruff check app
            - run: ruff format --check app

    test:
        runs-on: ubuntu-slim
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: 3.11
            - run: pip install -r app/requirements.txt -r app/requirements-test.txt
            - run: pytest

    test-compose:
        runs-on: ubuntu-slim
        steps:
            - uses: actions/checkout@v4
            - run: docker compose --env-file compose/.env.example -f compose/docker-compose.yml config -q

    build:
        needs: [lint, test, test-compose]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v4

            - uses: docker/login-action@v3
              if: github.event_name != 'pull_request'
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v6
              with:
                  context: ./app
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: |
                      ghcr.io/smakevkin/devopspracticum:${{ github.ref_name }}
                      ghcr.io/smakevkin/devopspracticum:${{ github.sha }}
